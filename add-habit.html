<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Add or Edit a Habit - Personal Habit Tracker">
  <title>Add / Edit Habit - Personal Habit Tracker</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Site Header & Global Nav (UI-01) -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand" aria-label="Personal Habit Tracker Home">
        <span class="brand-badge">&#9632;</span>
        <span>HABIT // TRACKER</span>
      </a>

      <nav aria-label="Main Navigation">
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link"><span class="nav-text">Dashboard</span></a></li>
          <li><a href="add-habit.html" class="nav-link active"><span class="nav-text">Add Habit</span></a></li>
          <li><a href="progress.html" class="nav-link"><span class="nav-text">Progress</span></a></li>
          <li><a href="settings.html" class="nav-link"><span class="nav-text">Settings</span></a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <button id="theme-toggle-btn" class="btn btn-sm" aria-label="Toggle dark/light theme">
          <span aria-hidden="true">&#9790;</span> Dark
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content">
    <div class="container">
      
      <section class="form-card" aria-labelledby="form-page-title">
        <div class="form-header">
          <h1 id="form-page-title" style="font-size: 1.5rem; font-weight: 800;">Create New Habit</h1>
          <p style="color: var(--fg-secondary); font-size: 0.875rem; margin-top: 0.25rem;">
            Define a clear, measurable routine to maintain your momentum.
          </p>
        </div>

        <form id="habit-form" novalidate>
          
          <!-- Habit Name (FR-01) -->
          <div class="form-group">
            <label for="habit-name" class="form-label">
              Habit Name <span class="required" style="color: var(--fg-primary);">*</span>
            </label>
            <input type="text" id="habit-name" class="form-input" placeholder="e.g. Morning 5km Run, Drink 2L Water" maxlength="50" required>
            <div id="name-counter" class="char-counter">0 / 50</div>
            <div id="error-name" class="inline-error" role="alert"></div>
          </div>

          <!-- Category (FR-02) -->
          <div class="form-group">
            <label for="habit-category" class="form-label">Category</label>
            <select id="habit-category" class="form-select">
              <option value="Health">Health</option>
              <option value="Study">Study</option>
              <option value="Fitness">Fitness</option>
              <option value="Personal">Personal</option>
              <option value="Work">Work</option>
              <option value="Mindfulness">Mindfulness</option>
              <option value="Finance">Finance</option>
            </select>
          </div>

          <!-- Description (FR-02) -->
          <div class="form-group">
            <label for="habit-desc" class="form-label">Description (Optional)</label>
            <textarea id="habit-desc" class="form-textarea" rows="3" placeholder="Add specific triggers, intentions, or notes..." maxlength="200"></textarea>
            <div id="desc-counter" class="char-counter">0 / 200</div>
            <div id="error-description" class="inline-error" role="alert"></div>
          </div>

          <!-- Target Frequency (FR-02) -->
          <div class="form-group">
            <label class="form-label">Target Frequency (Scheduled Weekdays) <span class="required">*</span></label>
            <div class="freq-presets">
              <button type="button" id="preset-all" class="btn btn-sm">Every Day</button>
              <button type="button" id="preset-weekdays" class="btn btn-sm">Weekdays</button>
              <button type="button" id="preset-weekends" class="btn btn-sm">Weekends</button>
            </div>
            <div class="weekdays-picker" role="group" aria-label="Select days of the week">
              <button type="button" class="weekday-btn selected" data-day="0" aria-pressed="true">Sun</button>
              <button type="button" class="weekday-btn selected" data-day="1" aria-pressed="true">Mon</button>
              <button type="button" class="weekday-btn selected" data-day="2" aria-pressed="true">Tue</button>
              <button type="button" class="weekday-btn selected" data-day="3" aria-pressed="true">Wed</button>
              <button type="button" class="weekday-btn selected" data-day="4" aria-pressed="true">Thu</button>
              <button type="button" class="weekday-btn selected" data-day="5" aria-pressed="true">Fri</button>
              <button type="button" class="weekday-btn selected" data-day="6" aria-pressed="true">Sat</button>
            </div>
            <div id="error-frequency" class="inline-error" role="alert"></div>
          </div>

          <!-- Start Date (FR-02) -->
          <div class="form-group">
            <label for="habit-start-date" class="form-label">Start Date</label>
            <input type="date" id="habit-start-date" class="form-input" required>
            <div id="error-startDate" class="inline-error" role="alert"></div>
          </div>

          <!-- Form Actions -->
          <div style="display: flex; gap: 0.75rem; align-items: center; justify-content: flex-end; margin-top: 2rem;">
            <a href="index.html" class="btn">Cancel</a>
            <button type="submit" id="submit-habit-btn" class="btn btn-primary">Save Habit</button>
          </div>

        </form>
      </section>

    </div>
  </main>

  <!-- Global Toast Notification Container -->
  <div class="toast-container" aria-live="polite"></div>

  <!-- Application Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/streaks.js"></script>
  <script src="js/habits.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
